[build-system]
requires      = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "forged"
version         = "1.0.1"
description     = "FORGED — Android Kernel Builder with AnyKernel3 packaging, powered by Rich TUI"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.10"
authors         = [{ name = "vxyzview" }]
keywords        = ["android", "kernel", "builder", "anykernel3", "clang", "llvm"]

dependencies = [
    "rich",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
forged = "kernel_builder.main:run"

[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff ─────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W", "N", "C4"]
ignore = [
    "N818",   # Exception names don't need an 'Error' suffix (project style)
]

# ── mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version        = "3.10"
strict                = false
ignore_missing_imports = true

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"
