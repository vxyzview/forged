name: Demo GIF

# Renders docs/demo.gif from docs/demo.tape with charmbracelet/vhs and
# commits it back to the default branch (if changed).
#
# Requires repo setting: Actions → General → Workflow permissions →
# "Read and write permissions".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/demo.tape
      - test/fixtures/kernel-fixture/**
      - internal/**
      - .github/workflows/demo.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # vhs commits the GIF back — needs history + a pushable token
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true

      - name: Build forged
        run: go build -trimpath -ldflags "-s -w" -o /usr/local/bin/forged ./cmd/forged

      # Install everything `forged doctor` checks for, so the demo opens on
      # a full wall of ✓ (no red ✗ rows in the hero GIF).
      - name: Install doctor deps (all-green doctor scene)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang lld llvm flex bison bc ccache aria2 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf
          # Point LLVM binutils names at the installed binaries where needed
          for tool in ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            command -v "$tool" >/dev/null 2>&1 || sudo ln -sf "/usr/bin/${tool#llvm-}" "/usr/bin/$tool" 2>/dev/null || true
          done
          true

      - name: Install ttyd + ffmpeg (vhs runtime deps)
        run: |
          # apt's ffmpeg is fine; ttyd comes from the vhs-recommended binary
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 \
            -o ttyd && chmod +x ttyd && sudo mv ttyd /usr/local/bin/
          git config user.name  "forged-demo-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Install vhs
        run: go install github.com/charmbracelet/vhs@latest

      # The tape records a full fixture build plus `forged doctor` and
      # `forged info` — all real output, nothing staged.
      - name: Render demo GIF
        run: vhs docs/demo.tape

      - name: Check GIF size (README embed must stay reasonable)
        run: |
          ls -lh docs/demo.gif
          # Warn (not fail) if the GIF balloons past ~6 MB
          SIZE=$(stat -c%s docs/demo.gif)
          if [ "$SIZE" -gt 6291456 ]; then
            echo "::warning::docs/demo.gif is $((SIZE/1048576)) MB — consider trimming Sleeps in docs/demo.tape"
          fi

      - name: Commit rendered GIF (if changed)
        run: |
          if [ ! -f docs/demo.gif ]; then
            echo "vhs did not produce docs/demo.gif" >&2
            exit 1
          fi
          # `git diff --quiet` only sees tracked files; demo.gif is
          # .gitattributes-ignored, so check the index/untracked state too.
          if git status --porcelain docs/demo.gif | grep -q .; then
            git add -f docs/demo.gif
            git commit -m "docs: refresh demo GIF [skip ci]"
            git push
          else
            echo "GIF unchanged — nothing to commit"
          fi
