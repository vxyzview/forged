version: 2
updates:
  # Go module dependencies (bubbletea, huh, cobra, ...)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions (checkout, setup-go, upload-artifact, ...)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Dockerfile base images (golang:1.27, ubuntu:24.04)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
